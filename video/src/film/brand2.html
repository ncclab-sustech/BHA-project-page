<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,800;1,6..96,400;1,6..96,600&family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#070709;--cream:#efe9dc;--coral:#ff5a3c;--blue:#2b5cff;--fg:#f3eee4}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--fg);-webkit-font-smoothing:antialiased;font-family:'Syne',sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity;overflow:hidden}
.leak{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(170px);opacity:.14;will-change:transform}
#l1{background:radial-gradient(circle,#ff5a3c,transparent 60%)}
#l2{background:radial-gradient(circle,#2b5cff,transparent 60%)}
#vig{position:absolute;inset:0;background:radial-gradient(85% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.7) 100%);pointer-events:none}
#grain{position:absolute;inset:-200px;opacity:.085;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='2' stitchTiles='stitch'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;pointer-events:none}
#flash{position:absolute;inset:0;background:var(--cream);opacity:0;pointer-events:none}
#frame{position:absolute;inset:0;pointer-events:none;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,238,228,.62)}
#frame div{position:absolute}
#frame .ch{left:64px;top:46px}#frame .tc{right:64px;top:46px;letter-spacing:.12em}#frame .bl{left:64px;bottom:44px}#frame .brr{right:64px;bottom:44px}
#frame .ch b{color:var(--coral);font-weight:400;margin-right:14px}
#frame.light{color:rgba(10,10,14,.6)}
.didone{font-family:'Bodoni Moda',serif;font-weight:400;letter-spacing:-.025em;line-height:.95;font-variation-settings:'opsz' 96}
.didone em{font-style:italic;font-weight:400}
.didone.b{font-weight:600}
.syne{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.04em;line-height:.92}
.lab{position:absolute;font-family:'JetBrains Mono',monospace;font-weight:400;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,238,228,.7)}
.lab b{color:var(--coral);font-weight:400}
.line{position:absolute;left:0;right:0;text-align:center}
.line .w{display:inline-block;margin:0 .13em;will-change:transform,opacity,filter}
.line .w.it{font-style:italic}
.acc{color:var(--coral)}
.num{font-family:'Bodoni Moda',serif;font-weight:400;font-variation-settings:'opsz' 96;letter-spacing:-.03em;line-height:.9;font-variant-numeric:tabular-nums}
.img{position:absolute;overflow:hidden;background:#0d0d10}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .nz{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");mix-blend-mode:screen;opacity:0}
.cream{position:absolute;inset:0;background:var(--cream);color:#0b0b0f}
.cream .lab{color:rgba(11,11,15,.6)}
.cream .acc{color:var(--coral)}
.rule{position:absolute;height:1px;background:currentColor;opacity:.5;transform-origin:left center}
.hud{position:absolute;pointer-events:none}
.hud .br{position:absolute;width:22px;height:22px;border:1.5px solid currentColor}
.hud .tl{left:0;top:0;border-right:0;border-bottom:0}.hud .tr{right:0;top:0;border-left:0;border-bottom:0}.hud .bl{left:0;bottom:0;border-right:0;border-top:0}.hud .brr{right:0;bottom:0;border-left:0;border-top:0}
.hud .hl{position:absolute;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;opacity:.9}
.hud .hl b{color:var(--coral);font-weight:400}
svg.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
svg.ov path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
canvas.cv{position:absolute;left:0;top:0}
.mark{position:absolute;left:0;right:0;text-align:center;font-family:'Syne';font-weight:800;letter-spacing:.3em;font-size:54px}
.mark i{display:inline-block;width:22px;height:22px;border-radius:6px;transform:rotate(45deg);background:linear-gradient(95deg,#06c7f1,#2b5cff,#7c3aed,#ff3d81);margin-right:26px;vertical-align:middle;position:relative;top:-5px}
.map{position:absolute;overflow:hidden}
.map canvas{width:100%;height:100%;display:block}
.strip{position:absolute;left:0;width:1920px;white-space:nowrap;overflow:hidden;font-family:'Bodoni Moda',serif;font-style:italic;font-variation-settings:'opsz' 96}
.strip span{display:inline-block;padding-right:.6em}
.strip span i{font-style:normal;color:var(--coral);padding:0 .35em}
.ring{position:absolute;width:420px;height:420px}
.ring text{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.32em;fill:currentColor;text-transform:uppercase}
.vt{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.outl{-webkit-text-stroke:1.5px currentColor;color:transparent!important}
#pre{position:absolute;left:-9999px;top:0;opacity:0}
</style></head>
<body>
<div id="stage">
  <div class="leak" id="l1"></div><div class="leak" id="l2"></div>
  <div id="scenes"></div>
  <div id="vig"></div><div id="grain"></div>
  <div id="frame"><div class="ch"></div><div class="tc"></div><div class="bl">beyond hierarchical alignment</div><div class="brr">a film · 2026</div></div>
  <div id="flash"></div>
  <div id="pre"><span style="font-family:'Bodoni Moda';font-weight:400">a</span><span style="font-family:'Bodoni Moda';font-weight:600">a</span><span style="font-family:'Bodoni Moda';font-weight:800">a</span><span style="font-family:'Bodoni Moda';font-style:italic">a</span><span style="font-family:'Bodoni Moda';font-style:italic;font-weight:600">a</span><span style="font-family:Syne;font-weight:400">a</span><span style="font-family:Syne;font-weight:600">a</span><span style="font-family:Syne;font-weight:800">a</span><span style="font-family:'JetBrains Mono';font-weight:400">a</span><span style="font-family:'JetBrains Mono';font-weight:300">a</span></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const E={out:x=>1-Math.pow(1-x,3),inout:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,lin:x=>x,expo:x=>x===1?1:1-Math.pow(2,-10*x),sine:x=>-(Math.cos(Math.PI*x)-1)/2,back:x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},quint:x=>1-Math.pow(1-x,5)};
const P=(t,s,d,e=E.out)=>e(clamp((t-s)/d));
const L=(a,b,p)=>a+(b-a)*p;
const SHOW=encodeURI(window.SHOW_DIR||'');const INS=encodeURI(window.INS_DIR||'');
const src=(id,k)=>SHOW+'/'+id+'_'+k+'.jpg';
function el(tag,cls,html,st){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(st)for(const k in st){const v=st[k];e.style[k]=(typeof v==='number'&&k!=='opacity'&&k!=='zIndex')?v+'px':v;}return e;}
function svgEl(n,at){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in at||{})e.setAttribute(k,at[k]);return e;}
// words: "*" prefix = accent, "_" prefix = italic
function words(parent,text,cls,st){const h=el('div','line '+cls,'',st);text.split(' ').forEach(w=>{let c='w';if(w[0]==='*'){c+=' acc';w=w.slice(1);}if(w[0]==='_'){c+=' it';w=w.slice(1);}const s=el('span',c,w);s.style.opacity=0;h.appendChild(s);});parent.appendChild(h);return h;}
function setWords(h,t,s,stag=.1,dur=1.1,outAt=null,outDur=.7,mode='rise'){const ws=h.querySelectorAll('.w');ws.forEach((w,i)=>{const p=P(t,s+i*stag,dur,E.quint);let q=0;if(outAt!=null)q=P(t,outAt+i*.03,outDur,E.sine);w.style.opacity=p*(1-q);if(mode==='rise'){w.style.transform=`translateY(${L(40,0,p)-q*22}px) skewY(${L(3,0,p)}deg)`;w.style.filter=`blur(${(1-p)*8+q*6}px)`;}else if(mode==='mask'){w.style.transform=`translateY(${L(110,0,p)}%) rotate(${L(4,0,p)}deg)`;w.style.filter='none';}else{w.style.transform=`scale(${L(.86,1,p)})`;w.style.filter=`blur(${(1-p)*14}px)`;}});}
function fade(e,t,s,d=1,outAt=null,outDur=.8){let p=P(t,s,d,E.sine);if(outAt!=null)p*=1-P(t,outAt,outDur,E.sine);e.style.opacity=p;return p;}
function imgBox(id,k,st){const b=el('div','img','',st);b.appendChild(el('img'));b.querySelector('img').src=src(id,k);b.appendChild(el('div','nz'));return b;}
function materialize(box,t,s,d){const p=P(t,s,d,E.sine);const img=box.querySelector('img');const nz=box.querySelector('.nz');img.style.filter=`blur(${(1-p)*36}px) saturate(${.05+.95*p}) contrast(${.8+.2*p})`;img.style.transform=`scale(${1.2-.2*p})`;nz.style.opacity=(1-p)*.9;}
function draw(path,t,s,d,e=E.inout){const len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len*(1-P(t,s,d,e));}
function callout(parent,x,y,w,h,label,side='below'){const d=el('div','hud','',{left:x,top:y,width:w,height:h,opacity:0});['tl','tr','bl','brr'].forEach(c=>d.appendChild(el('i','br '+c)));const lab=el('div','hl',label);if(side==='below'){lab.style.left='0';lab.style.top=(h+16)+'px';}else if(side==='above'){lab.style.left='0';lab.style.top='-36px';}else{lab.style.left=(w+26)+'px';lab.style.top=Math.round(h/2-10)+'px';}d.appendChild(lab);parent.appendChild(d);return d;}
function setCallout(d,t,s,dur=.7,outAt=null){const p=P(t,s,dur,E.quint);let o=p;if(outAt!=null)o*=1-P(t,outAt,.4,E.sine);d.style.opacity=o;d.querySelectorAll('.br').forEach(b=>{b.style.transform=`scale(${L(1.8,1,p)})`;});const lab=d.querySelector('.hl');lab.style.transform=`translateY(${L(10,0,p)}px)`;}
function drawMap(cv,m){const n=m.length,ctx=cv.getContext('2d'),flat=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)flat.push(Math.abs(m[i][j]));const sorted=flat.slice().sort((a,b)=>a-b);const rank=v=>{let lo=0,hi=sorted.length;while(lo<hi){const mid=(lo+hi)>>1;if(sorted[mid]<v)lo=mid+1;else hi=mid;}return lo/(sorted.length-1)};const col=v=>{const a=Math.abs(v);return v>=0?`rgb(255,${Math.round(255-a*215)},${Math.round(255-a*230)})`:`rgb(${Math.round(255-a*215)},${Math.round(255-a*160)},255)`};const cell=cv.width/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y][x];ctx.fillStyle=col((v<0?-1:1)*rank(Math.abs(v)));ctx.fillRect(x*cell,y*cell,cell+.5,cell+.5);}}
function wipe(e,p,dir='r'){if(dir==='r')e.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;else if(dir==='l')e.style.clipPath=`inset(0 0 0 ${(1-p)*100}%)`;else if(dir==='d')e.style.clipPath=`inset(0 0 ${(1-p)*100}% 0)`;else e.style.clipPath=`inset(${(1-p)*100}% 0 0 0)`;}
function ring(parent,x,y,text,st){const s=svgEl('svg',{class:'ring',viewBox:'0 0 420 420'});s.style.left=x+'px';s.style.top=y+'px';if(st)for(const k in st)s.style[k]=st[k];const d=svgEl('path',{id:'rp'+Math.random().toString(36).slice(2),d:'M210,210 m-170,0 a170,170 0 1,1 340,0 a170,170 0 1,1 -340,0',fill:'none'});s.appendChild(d);const tx=svgEl('text');const tp=svgEl('textPath',{href:'#'+d.id});tp.textContent=text;tx.appendChild(tp);s.appendChild(tx);parent.appendChild(s);return s;}
const scenes=[];const CUTS=[];
function scene(start,dur,build,opts={}){const root=el('div','scene');document.getElementById('scenes').appendChild(root);const s={root,start,dur,opts};s.render=build(root)||(()=>{});scenes.push(s);if(opts.cut)CUTS.push(start);return s;}
const EEG=window.EEG||[];const ATTR=window.ATTR||null;
function eegPath(ch,x0,x1,y,amp,step=1){let d='';const n=ch.length;for(let i=0;i<n;i+=step){const x=x0+(x1-x0)*i/(n-1);const yy=y-ch[i]*amp;d+=(i?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1)+' ';}return d;}
// deterministic pseudo-random
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
// ---- particle cosmos (3-D point cloud, projected, stateless in t) ----
function cosmos(n,seed){const r=rng(seed);const pts=[];for(let i=0;i<n;i++){const u=r()*2-1,ph=r()*Math.PI*2,rad=Math.pow(r(),.42)*1;const s=Math.sqrt(1-u*u);pts.push([rad*s*Math.cos(ph),rad*u,rad*s*Math.sin(ph),.4+r()*1.6,r()]);}return pts;}
function drawCosmos(cv,pts,t,o){const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);const ax=o.ax||t*.12,ay=o.ay||t*.07;const ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay);const Z=o.zoom||1,fov=o.fov||1.8;const cx=o.cx||W/2,cy=o.cy||H/2;const proj=[];for(const p of pts){let x=p[0],y=p[1],z=p[2];let x1=x*cb-z*sb,z1=x*sb+z*cb;let y1=y*ca-z1*sa,z2=y*sa+z1*ca;const d=fov/(fov+z2*1.0);proj.push([cx+x1*d*Z*H*.42,cy+y1*d*Z*H*.42,d,p[3],p[4]]);}
 if(o.links){ctx.lineWidth=.6;for(let i=0;i<o.links.length;i++){const [a,b]=o.links[i];const A=proj[a],B=proj[b];const al=clamp((Math.sin(t*1.3+i*.37)+1)/2-.3)*.55*(o.alpha||1);if(al<=0)continue;ctx.strokeStyle=`rgba(243,238,228,${al})`;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}}
 for(const q of proj){const s=q[3]*q[2]*(o.size||1);const tw=.55+.45*Math.sin(t*2.2+q[4]*40);const a=clamp(.25+.75*tw)*(o.alpha||1)*clamp((q[2]-.5)*2);if(a<=0)continue;ctx.fillStyle=q[4]<.06?`rgba(255,90,60,${a})`:(q[4]<.11?`rgba(80,130,255,${a})`:`rgba(243,238,228,${a})`);ctx.beginPath();ctx.arc(q[0],q[1],s,0,6.283);ctx.fill();}
}
const PTS=cosmos(4200,11);const LINKS=(()=>{const r=rng(5),L=[];for(let i=0;i<900;i++){const a=Math.floor(r()*PTS.length);let best=-1,bd=1e9;for(let k=0;k<40;k++){const b=Math.floor(r()*PTS.length);if(b===a)continue;const d=(PTS[a][0]-PTS[b][0])**2+(PTS[a][1]-PTS[b][1])**2+(PTS[a][2]-PTS[b][2])**2;if(d<bd){bd=d;best=b;}}if(best>=0&&bd<.03)L.push([a,best]);}return L;})();

// ================= SCENES =================
// S1 (0–5.5) cold open: a single spark, then "Inside you,"
scene(0,5.5,r=>{
  const cv=el('canvas','cv');cv.width=1920;cv.height=1080;r.appendChild(cv);
  const lab=el('div','lab','one neuron · one spike · 1 ms',{left:0,right:0,top:620,textAlign:'center',opacity:0});r.appendChild(lab);
  const h=words(r,'Inside _you,','didone',{top:410,fontSize:'150px'});
  return t=>{const ctx=cv.getContext('2d');ctx.clearRect(0,0,1920,1080);const p=P(t,.3,1.4,E.sine);const burst=P(t,2.6,1.2,E.expo);const rr=L(2,7,p)+burst*900;const a=(1-burst)*p;const g=ctx.createRadialGradient(960,540,0,960,540,rr*6);g.addColorStop(0,`rgba(255,120,90,${.9*a})`);g.addColorStop(.25,`rgba(255,90,60,${.25*a})`);g.addColorStop(1,'rgba(255,90,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(960,540,rr*6,0,6.283);ctx.fill();ctx.fillStyle=`rgba(243,238,228,${a})`;ctx.beginPath();ctx.arc(960,540,rr*(1+.25*Math.sin(t*9)),0,6.283);ctx.fill();
   // ring shock
   const rp=P(t,2.6,1.6,E.out);if(rp>0&&rp<1){ctx.strokeStyle=`rgba(243,238,228,${(1-rp)*.8})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(960,540,rp*1100,0,6.283);ctx.stroke();}
   fade(lab,t,.9,.7,2.3,.3);setWords(h,t,3.0,.12,1.0,4.9,.5,'mask');}
});
// S2 (5.5–13) cosmos: 86 billion neurons
scene(5.5,7.5,r=>{
  const cv=el('canvas','cv');cv.width=1920;cv.height=1080;r.appendChild(cv);
  const num=el('div','num','0',{position:'absolute',left:0,right:0,top:300,textAlign:'center',fontSize:'250px',opacity:0});r.appendChild(num);
  const lab=el('div','lab','neurons · three pounds · the most complex object we know',{left:0,right:0,top:600,textAlign:'center',opacity:0});r.appendChild(lab);
  const h=words(r,'a _universe.','didone',{top:380,fontSize:'190px'});
  const h2=words(r,'And we have never watched it think.','didone',{top:760,fontSize:'64px'});
  return t=>{const zin=P(t,0,7.5,E.lin);drawCosmos(cv,PTS,t,{zoom:L(.7,1.7,E.sine(zin)),alpha:clamp(t/1.2)*(1-P(t,6.6,.9,E.sine)),links:LINKS,size:1.15});
   const c=P(t,2.2,2.8,E.expo);const v=Math.round(86e9*c);num.textContent=v.toLocaleString('en-US');fade(num,t,2.2,.4,5.6,.4);num.style.transform=`scale(${L(.92,1,c)})`;fade(lab,t,2.8,.6,5.6,.4);
   setWords(h,t,.1,.14,1.0,1.9,.35,'mask');setWords(h2,t,5.3,.07,.9,7.0,.4);}
},{cut:true});
// S3 (13–19) cream page: 1924
scene(13,6,r=>{
  const c=el('div','cream');r.appendChild(c);
  const y=el('div','num','1924',{position:'absolute',left:120,top:150,fontSize:'420px',color:'#0b0b0f'});c.appendChild(y);
  const vt=el('div','vt','chapter ii · a century of listening',{right:70,top:160,color:'#0b0b0f'});c.appendChild(vt);
  const svg=svgEl('svg',{class:'ov'});svg.style.color='#0b0b0f';c.appendChild(svg);
  const pa=svgEl('path',{d:eegPath(EEG[5]||[],120,1800,830,90)});svg.appendChild(pa);
  const cap=el('div','lab','jena, germany · the first human electroencephalogram · two electrodes · a galvanometer',{left:120,top:950,opacity:0});c.appendChild(cap);
  const h=words(c,'A doctor _hears the brain for the first time.','didone',{top:610,left:120,right:'auto',width:1700,textAlign:'left',fontSize:'76px'});
  return t=>{wipe(y,P(t,.1,.9,E.quint),'r');y.style.transform=`translateX(${L(-40,0,P(t,.1,.9,E.quint))}px)`;draw(pa,t,.8,3.2,E.sine);fade(cap,t,2.0,.6);fade(vt,t,.5,.6);setWords(h,t,1.4,.06,.9,null,0,'mask');}
},{cut:true,flash:true});
// S4 (19–26) dark: a hundred years of listening, lines stack then flatten
scene(19,7,r=>{
  const svg=svgEl('svg',{class:'ov'});r.appendChild(svg);
  const N=Math.min(8,EEG.length);const paths=[];for(let c=0;c<N;c++){const pa=svgEl('path',{d:eegPath(EEG[c],120,1800,230+c*84,36)});pa.style.stroke=`rgba(243,238,228,${c>=N-3?.9:.38})`;svg.appendChild(pa);paths.push(pa);}
  const names=(window.EEGCH||[]);const labs=names.slice(0,N).map((n,c)=>{const l=el('div','lab',n,{left:62,top:230+c*84-9,opacity:0});r.appendChild(l);return l;});
  const big=el('div','num','100',{position:'absolute',right:120,top:120,fontSize:'520px',opacity:0,color:'transparent',webkitTextStroke:'2px rgba(255,90,60,.95)'});r.appendChild(big);
  const yl=el('div','lab','years',{right:130,top:640,opacity:0,fontSize:'22px'});r.appendChild(yl);
  const h=words(r,'We listened for a _hundred years.','didone',{top:880,fontSize:'80px'});
