<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#050507;color:#f2eee6;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#050507}
.leak{position:absolute;width:1400px;height:1400px;border-radius:50%;filter:blur(160px);opacity:.16;will-change:transform}
#l1{background:radial-gradient(circle,#ff6b4a,transparent 60%)}
#l2{background:radial-gradient(circle,#2b5cff,transparent 60%)}
#vig{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
#grain{position:absolute;inset:-200px;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/></filter><rect width='320' height='320' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.01em}
.sans{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.04em}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;font-size:20px;color:rgba(242,238,230,.55)}
.line{position:absolute;left:0;right:0;text-align:center;line-height:1.08}
.line .w{display:inline-block;margin:0 .14em;will-change:transform,opacity,filter}
.acc{color:#ff6b4a}
.img{position:absolute;overflow:hidden;background:#0a0a0d}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .nz{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");mix-blend-mode:screen}
.cap{position:absolute;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,238,230,.6)}
svg.eeg{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg.eeg path{fill:none;stroke:rgba(242,238,230,.9);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;will-change:transform}
.mark{position:absolute;left:0;right:0;text-align:center;font-family:'Plus Jakarta Sans';font-weight:800;letter-spacing:.22em;font-size:64px}
.mark i{display:inline-block;width:26px;height:26px;border-radius:7px;transform:rotate(45deg);background:linear-gradient(95deg,#06c7f1,#2b5cff,#7c3aed,#ff3d81);margin-right:28px;vertical-align:middle;position:relative;top:-6px}

.hud{position:absolute;pointer-events:none}
.hud .br{position:absolute;width:22px;height:22px;border:1.5px solid rgba(242,238,230,.9)}
.hud .tl{left:0;top:0;border-right:0;border-bottom:0}.hud .tr{right:0;top:0;border-left:0;border-bottom:0}.hud .bl{left:0;bottom:0;border-right:0;border-top:0}.hud .brr{right:0;bottom:0;border-left:0;border-top:0}
.hud .lab{position:absolute;font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,238,230,.85);white-space:nowrap}
.hud .lab b{color:#ff6b4a;font-weight:400}
.hud .lead{position:absolute;height:1px;background:rgba(242,238,230,.55);transform-origin:left center}
.mk{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(242,238,230,.45)}
.mk span{position:absolute;top:-30px;left:8px;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.14em;color:rgba(242,238,230,.75)}
.cream{position:absolute;inset:0;background:#efece4}
.cream .serif{color:#15151a}
.cream .mark{color:#15151a}
.cream .cap{color:rgba(21,21,26,.55)}
.map{position:absolute;overflow:hidden}
.map canvas{width:100%;height:100%;display:block}
</style></head>
<body>
<div id="stage">
  <div class="leak" id="l1"></div><div class="leak" id="l2"></div>
  <div id="scenes"></div>
  <div id="vig"></div><div id="grain"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const E={out:x=>1-Math.pow(1-x,3),inout:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,lin:x=>x,expo:x=>x===1?1:1-Math.pow(2,-10*x),sine:x=>-(Math.cos(Math.PI*x)-1)/2};
const P=(t,s,d,e=E.out)=>e(clamp((t-s)/d));
const L=(a,b,p)=>a+(b-a)*p;
const SHOW=encodeURI(window.SHOW_DIR||'');
const src=(id,k)=>SHOW+'/'+id+'_'+k+'.jpg';
function el(tag,cls,html,st){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(st)for(const k in st){const v=st[k];e.style[k]=(typeof v==='number'&&k!=='opacity'&&k!=='zIndex')?v+'px':v;}return e;}
function words(parent,text,cls,st){const h=el('div','line '+cls,'',st);text.split(' ').forEach(w=>{const s=el('span','w',w.replace(/^\*/,''));if(/^\*/.test(w))s.classList.add('acc');h.appendChild(s)});parent.appendChild(h);return h;}
// slow, breathing word reveal: blur + letterspace + rise; soft out
function setWords(h,t,s,stag=.12,dur=1.3,outAt=null,outDur=.9){const ws=h.querySelectorAll('.w');ws.forEach((w,i)=>{const p=P(t,s+i*stag,dur,E.sine);let o=p,q=0;if(outAt!=null){q=P(t,outAt+i*.04,outDur,E.sine);o=p*(1-q);}w.style.opacity=o;w.style.transform=`translateY(${L(26,0,p)-q*18}px)`;w.style.filter=`blur(${(1-p)*10+q*6}px)`;w.style.letterSpacing=`${L(.06,0,p)-q*.02}em`;});}
function fade(e,t,s,d=1.2,outAt=null,outDur=1){let p=P(t,s,d,E.sine);if(outAt!=null)p*=1-P(t,outAt,outDur,E.sine);e.style.opacity=p;return p;}
function materialize(box,t,s,d){const p=P(t,s,d,E.sine);const img=box.querySelector('img');const nz=box.querySelector('.nz');img.style.filter=`blur(${(1-p)*34}px) saturate(${.1+.9*p}) contrast(${.85+.15*p})`;img.style.transform=`scale(${1.18-.18*p})`;nz.style.opacity=(1-p)*.9;box.style.opacity=clamp(p*5);}
function imgBox(id,k,st){const b=el('div','img','',st);b.appendChild(el('img'));b.querySelector('img').src=src(id,k);b.appendChild(el('div','nz'));return b;}
function draw(path,t,s,d,e=E.inout){const len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len*(1-P(t,s,d,e));}


function callout(parent,x,y,w,h,label,side='below'){const d=el('div','hud','',{left:x,top:y,width:w,height:h,opacity:0});['tl','tr','bl','brr'].forEach(c=>d.appendChild(el('i','br '+c)));const lab=el('div','lab',label);if(side==='below'){lab.style.left='0';lab.style.top=(h+14)+'px';}else if(side==='above'){lab.style.left='0';lab.style.top='-34px';}else if(side==='right'){lab.style.left=(w+26)+'px';lab.style.top=Math.round(h/2-10)+'px';const ld=el('i','lead','',{left:w,top:Math.round(h/2),width:18});d.appendChild(ld);}d.appendChild(lab);parent.appendChild(d);return d;}
function setCallout(d,t,s,dur=.8,outAt=null){const p=P(t,s,dur,E.sine);let o=p;if(outAt!=null)o*=1-P(t,outAt,.5,E.sine);d.style.opacity=o;d.querySelectorAll('.br').forEach(b=>{b.style.transform=`scale(${L(1.6,1,p)})`;b.style.opacity=p;});const lab=d.querySelector('.lab');lab.style.transform=`translateY(${L(8,0,p)}px)`;}
function marker(parent,x,label){const m=el('div','mk','',{left:x,top:0,height:'100%',opacity:0});m.appendChild(el('span','',label));parent.appendChild(m);return m;}
function drawMap(cv,m){const n=m.length,ctx=cv.getContext('2d'),flat=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)flat.push(Math.abs(m[i][j]));const sorted=flat.slice().sort((a,b)=>a-b);const rank=v=>{let lo=0,hi=sorted.length;while(lo<hi){const mid=(lo+hi)>>1;if(sorted[mid]<v)lo=mid+1;else hi=mid;}return lo/(sorted.length-1)};const col=v=>{const a=Math.abs(v);return v>=0?`rgb(255,${Math.round(255-a*215)},${Math.round(255-a*230)})`:`rgb(${Math.round(255-a*215)},${Math.round(255-a*160)},255)`};const cell=cv.width/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=m[y][x];ctx.fillStyle=col((v<0?-1:1)*rank(Math.abs(v)));ctx.fillRect(x*cell,y*cell,cell+.5,cell+.5);}}
const scenes=[];
function scene(start,dur,build){const root=el('div','scene');document.getElementById('scenes').appendChild(root);const s={root,start,dur};s.render=build(root)||(()=>{});scenes.push(s);return s;}
const EEG=window.EEG||[];
function eegPath(ch,x0,x1,y,amp,step=1){let d='';const n=ch.length;for(let i=0;i<n;i+=step){const x=x0+(x1-x0)*i/(n-1);const yy=y-ch[i]*amp;d+=(i?'L':'M')+x.toFixed(1)+' '+yy.toFixed(1)+' ';}return d;}

// ---------- S1 (0–9) one line draws across ----------
scene(0,9,r=>{
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','eeg');r.appendChild(svg);
  const pa=document.createElementNS('http://www.w3.org/2000/svg','path');pa.setAttribute('d',eegPath(EEG[5]||[],160,1760,540,120));svg.appendChild(pa);
  const c1=callout(r,160+1600*0.10-30,470,60,150,'<b>100 ms</b> · first visual response','below');
  const c2=callout(r,160+1600*0.22-30,470,60,150,'<b>220 ms</b> · second peak','above');
  const cap=el('div','cap','participant 08 · occipital electrode Oz · 250 Hz · one picture',{left:160,top:700,opacity:0});r.appendChild(cap);
  const h=words(r,'Every second, your brain is drawing.','serif',{top:250,fontSize:'92px'});
  return t=>{draw(pa,t,0.4,3.6,E.sine);pa.style.opacity=1-P(t,7.6,1.2,E.sine);setCallout(c1,t,2.0,.8,7.3);setCallout(c2,t,2.5,.8,7.3);fade(cap,t,1.2,1,7.4,.8);setWords(h,t,3.4,.14,1.4,7.4);}
});
// ---------- S2 (9–17) many lines ----------
scene(9,8,r=>{
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','eeg');r.appendChild(svg);
  const paths=[];const N=Math.min(8,EEG.length);for(let c=0;c<N;c++){const pa=document.createElementNS('http://www.w3.org/2000/svg','path');pa.setAttribute('d',eegPath(EEG[c],160,1760,260+c*78,30));pa.style.stroke=`rgba(242,238,230,${c>=N-3?.85:.35})`;svg.appendChild(pa);paths.push(pa);}
  const names=(window.EEGCH||['F3','C3','Cz','Pz','O1','Oz','O2','P4']);const labs=names.slice(0,N).map((n,c)=>{const l=el('div','cap',n,{left:100,top:260+c*78-10,opacity:0});r.appendChild(l);return l;});
  const m1=marker(r,160+1600*0.10,'100 ms');const m2=marker(r,160+1600*0.22,'220 ms');[m1,m2].forEach(m=>{m.style.top='200px';m.style.height='660px';});
  const h=words(r,'It draws what *you see.','serif',{top:880,fontSize:'84px'});
  return t=>{paths.forEach((pa,i)=>{draw(pa,t,.2+i*.18,2.2,E.sine);pa.style.opacity=1-P(t,6.6,1.2,E.sine)});labs.forEach((l,i)=>fade(l,t,.4+i*.18,.6,6.5,.6));fade(m1,t,2.8,.8,6.5,.6);fade(m2,t,3.1,.8,6.5,.6);setWords(h,t,2.6,.14,1.4,6.6);}
});
// ---------- S3 (17–25) a century of listening ----------
scene(17,8,r=>{
  const h1=words(r,'For a century we could only listen.','serif',{top:420,fontSize:'92px'});
  const h2=words(r,'Now we can *look.','serif',{top:420,fontSize:'120px'});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','eeg');r.appendChild(svg);
  const flat=document.createElementNS('http://www.w3.org/2000/svg','path');flat.setAttribute('d','M160 720 L 1760 720');flat.style.stroke='rgba(242,238,230,.35)';svg.appendChild(flat);
  return t=>{setWords(h1,t,.3,.12,1.3,3.4,.6);setWords(h2,t,4.6,.16,1.5,7.3,.7);draw(flat,t,0,3.5,E.sine);flat.style.opacity=1-P(t,3.6,1,E.sine);}
});
// ---------- S4 (25–37) seen → decoded, the first picture ----------
scene(25,12,r=>{
  const seen=imgBox('lamb','gt',{left:300,top:170,width:620,height:620,borderRadius:0,opacity:0});seen.querySelector('.nz').style.opacity=0;r.appendChild(seen);
  const dec=imgBox('lamb','gen0',{left:1000,top:170,width:620,height:620,borderRadius:0,opacity:0});r.appendChild(dec);
  const c1=callout(r,286,156,648,648,'what she saw · <b>lamb</b> · 500 ms on screen','below');const c2=callout(r,986,156,648,648,'what we decoded · <b>from EEG</b> · 63 electrodes','below');
  const h=words(r,'The first picture.','serif',{top:930,fontSize:'72px'});
  return t=>{fade(seen,t,.4,1.6,10.6,1);seen.querySelector('img').style.transform=`scale(${1+.04*clamp(t/12)})`;setCallout(c1,t,1.4,.8,10.4);materialize(dec,t,3.4,3.2);dec.style.opacity*= (1-P(t,10.6,1,E.sine));setCallout(c2,t,5.8,.8,10.4);setWords(h,t,7.4,.16,1.4,10.6);}
});
// ---------- S5 (37–55) montage of pairs with words ----------
scene(37,18,r=>{
  const PAIRS=[['goose','a goose'],['orange','an orange'],['suit','a stranger’s suit'],['cheetah','a cheetah'],['pear','pears'],['strawberry','a strawberry']];
  const items=PAIRS.map(([id,w],i)=>{const g=imgBox(id,'gt',{left:160,top:120,width:760,height:760,borderRadius:0,opacity:0});g.querySelector('.nz').style.opacity=0;const d=imgBox(id,'gen0',{left:1000,top:120,width:760,height:760,borderRadius:0,opacity:0});const h=words(r,w,'serif',{top:930,fontSize:'60px'});r.appendChild(g);r.appendChild(d);return{g,d,h,s:i*3};});
  const c1=callout(r,146,106,788,788,'seen','above');const c2=callout(r,986,106,788,788,'decoded · <b>from EEG</b>','above');
  return t=>{setCallout(c1,t,.3,.8,16.8);setCallout(c2,t,.3,.8,16.8);items.forEach(it=>{const s=it.s;const o=P(t,s,.6,E.sine)*(1-P(t,s+2.75,.35,E.sine));it.g.style.opacity=o;it.g.querySelector('img').style.transform=`scale(${1+.05*clamp((t-s)/3)})`;materialize(it.d,t,s+.5,1.3);it.d.style.opacity*=o;setWords(it.h,t,s+.3,.08,.8,s+2.5,.4);});}
});
// ---------- S6 (55–64) four ways of seeing — real occlusion maps ----------
scene(55,9,r=>{
  const A=window.ATTR&&window.ATTR.bonnet;const img=el('div','img','',{left:160,top:150,width:560,height:560,borderRadius:0,opacity:0});img.appendChild(el('img'));img.querySelector('img').src=encodeURI(window.INS_DIR||'')+'/bonnet.jpg';r.appendChild(img);
  const names=[['openclip','OpenCLIP','raises the match'],['dfn','DFN','raises the match'],['mae','MAE','lowers it'],['dinov2l','DINOv2','lowers it']];
  const tiles=names.map(([g,n,d],i)=>{const x=840+(i%2)*440,y=130+Math.floor(i/2)*330;const m=el('div','map','',{left:x,top:y,width:250,height:250,opacity:0});const cv=document.createElement('canvas');cv.width=160;cv.height=160;m.appendChild(cv);if(A)drawMap(cv,A.maps[A.groups.indexOf(g)]);r.appendChild(m);const c=callout(r,x-12,y-12,274,274,`<b>${n}</b> · ${d}`,'below');return{m,c};});
  const ic=callout(r,146,136,588,588,'the same picture · <b>four experts</b>','below');
  const h=words(r,'Four ways of seeing. *One mind.','serif',{top:880,fontSize:'84px'});
  return t=>{fade(img,t,.3,1.2,7.8,.8);setCallout(ic,t,1.0,.8,7.6);tiles.forEach((tl,i)=>{fade(tl.m,t,1.6+i*.55,.8,7.8,.8);tl.m.style.transform=`translateY(${L(16,0,P(t,1.6+i*.55,.8,E.sine))}px)`;setCallout(tl.c,t,2.0+i*.55,.7,7.6);});setWords(h,t,4.2,.14,1.3,7.6);}
});
// ---------- S7 (64–72) no surgery — electrode schematic ----------
scene(64,8,r=>{
  const cx=1380,cy=470,R=250;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','eeg');r.appendChild(svg);
  const head=document.createElementNS('http://www.w3.org/2000/svg','path');head.setAttribute('d',`M${cx-R} ${cy} A${R} ${R*1.12} 0 1 1 ${cx+R} ${cy} A${R} ${R*1.12} 0 1 1 ${cx-R} ${cy} M${cx-30} ${cy-R*1.12+2} L${cx} ${cy-R*1.12-36} L${cx+30} ${cy-R*1.12+2}`);head.style.stroke='rgba(242,238,230,.5)';svg.appendChild(head);
  const pts=[[0,0]];[[6,.3],[12,.55],[18,.8],[26,1.0]].forEach(([n,f])=>{for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2;pts.push([Math.cos(a)*f*R*.92,Math.sin(a)*f*R*1.03]);}});
  const dots=pts.map(([x,y])=>{const d=document.createElementNS('http://www.w3.org/2000/svg','circle');d.setAttribute('cx',cx+x);d.setAttribute('cy',cy+y);d.setAttribute('r',5);d.style.fill='#f2eee6';d.style.opacity=0;svg.appendChild(d);return d;});
  const c=callout(r,cx-R-40,cy-R*1.12-60,2*R+80,2*R*1.12+100,'<b>63 electrodes</b> · 10-20 system · non-invasive','below');
  const h1=words(r,'No surgery. No implants.','sans',{top:380,fontSize:'78px',left:160,right:'auto',width:1000,textAlign:'left'});
  const h2=words(r,'A cap of electrodes, and a few hundred milliseconds.','serif',{top:500,fontSize:'48px',left:160,right:'auto',width:900,textAlign:'left'});
  return t=>{draw(head,t,.2,1.6,E.sine);dots.forEach((d,i)=>{d.style.opacity=P(t,.8+i*.045,.4,E.sine)*(1-P(t,6.6,.8,E.sine));});head.style.opacity=1-P(t,6.6,.8,E.sine);setCallout(c,t,3.4,.8,6.5);setWords(h1,t,.3,.16,1.2,6.4);setWords(h2,t,2.2,.08,1.2,6.4);}
});
// ---------- S8 (72–84) cream end card ----------
scene(72,12,r=>{
  const cream=el('div','cream');r.appendChild(cream);
  const h=words(cream,'See what the brain *sees.','serif',{top:330,fontSize:'136px'});
  const mark=el('div','mark','<i></i>BHA',{top:600,opacity:0});cream.appendChild(mark);
  const cap=el('div','cap','beyond hierarchical alignment · manuscript under review · 2026',{left:0,top:700,width:1920,textAlign:'center',opacity:0});cream.appendChild(cap);
  return t=>{cream.style.opacity=P(t,0,.9,E.sine);setWords(h,t,.9,.16,1.5);fade(mark,t,3.6,1.4);fade(cap,t,4.6,1.2);}
});
window.TOTAL=84;
window.seek=function(t){
  document.getElementById('l1').style.transform=`translate(${-500+Math.sin(t*.05)*220}px,${-400+Math.cos(t*.04)*160}px)`;
  document.getElementById('l2').style.transform=`translate(${1000+Math.sin(t*.045+2)*240}px,${300+Math.cos(t*.06+1)*160}px)`;
  document.getElementById('grain').style.transform=`translate(${(t*41)%160}px,${(t*29)%160}px)`;const cr=P(t,72,.9,E.sine);document.getElementById('vig').style.opacity=1-cr;document.getElementById('grain').style.opacity=.09-.06*cr;
  const X=1.0;
  scenes.forEach((s,i)=>{const lt=t-s.start;const inP=P(t,s.start-X*.5,X,E.sine);const outP=i<scenes.length-1?P(t,s.start+s.dur-X*.5,X,E.sine):P(t,s.start+s.dur-1.6,1.6,E.sine);const vis=inP>0&&outP<1;s.root.style.display=vis?'block':'none';if(!vis)return;s.root.style.opacity=inP*(1-outP);s.root.style.transform=`scale(${1+0.018*clamp(lt/s.dur)})`;s.render(lt);});
};
</script></body></html>
